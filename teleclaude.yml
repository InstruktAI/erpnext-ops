kind: project
company: instrukt-ai
business:
  publishes:
  - slug: erp
    trigger: Operating ERPNext tenant sites, business records, or 
      order-to-invoice workflows through the erpnext CLI
project_slug: erpnext-ops
code:
  enabled: true
docs:
  enabled: true
# Checkpoint maintenance overlay. The platform base (Makefile → install,
# docs/** → sync) is inherited. `test` is bound through a generic binding rather
# than the conventional `code` block: that block also attaches `log-check`, and
# this CLI ships no daemon logs for `instrukt-ai-logs` to read. See
# docs/project/policy/test-authorship.md.
checkpoint:
  bindings:
  - scope:
      include:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
    actions:
    - test
agents:
  enabled: false
