# yaml-language-server: $schema=.teleclaude/schemas/teleclaude-project.schema.json
kind: project
company: instrukt-ai
business:
  publishes:
  - slug: erp
    trigger: Operating ERPNext tenant sites, business records, or 
      order-to-invoice workflows through the erpnext CLI
project_slug: erpnext-ops
code:
  enabled: true
docs:
  enabled: true
checkpoint:
  bindings:
  - scope:
      include:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
    actions:
    - test
agents:
  enabled: false
schema_version: 26
project_name: erpnext-ops
description: Holds the erpnext-ops cli and ERP domain knowledge
