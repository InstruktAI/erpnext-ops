name: release

# Releases the erpnext plugin: builds it from the documents on main at the given
# version, commits the built plugin under plugins/ on main, tags that commit
# vX.Y.Z and publishes a GitHub Release with the plugin as a zip. What the
# release does lives in tools/tasks.py.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vX.Y.Z
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - run: make install

      - run: uv run --frozen python -m tools.tasks release "$VERSION"
