name: release

# Releases the erp plugin: builds it from the documents on main at the given
# version, lands the built plugin under plugins/ through a pull request, tags
# the merge commit vX.Y.Z and publishes a GitHub Release with the plugin as a
# zip.
#
# The built plugin lands through a merged pull request because a Claude
# organization that follows this repository re-syncs when a pull request with a
# plugin version bump is merged to the default branch
# (support.claude.com/en/articles/13837433-manage-plugins-for-your-organization).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vX.Y.Z
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION is already released"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: make install

      - name: Lint and test
        run: make lint test

      - name: Build the plugin at the release version
        run: |
          set -euo pipefail
          python3 tools/build_skill.py --version "${VERSION#v}" --out plugins/erp
          claude plugin validate plugins/erp
          claude plugin validate .

      - name: Land the built plugin through a pull request
        id: land
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/$VERSION"
          git switch --create "$branch"
          git add plugins/erp
          if git diff --cached --quiet; then
            echo "::error::the built plugin is identical to the released one; nothing to release"
            exit 1
          fi
          git commit --message "release(erp): $VERSION"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "release(erp): $VERSION" \
            --body "Built from the documents on main at $GITHUB_SHA by the release workflow.")
          gh pr merge "$url" --squash --delete-branch
          echo "sha=$(gh pr view "$url" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          MERGE_SHA: ${{ steps.land.outputs.sha }}
        run: |
          set -euo pipefail
          (cd plugins && zip --quiet --recurse-paths "../erp-plugin-$VERSION.zip" erp)
          gh release create "$VERSION" "erp-plugin-$VERSION.zip" --target "$MERGE_SHA" \
            --title "erp plugin $VERSION" --generate-notes
