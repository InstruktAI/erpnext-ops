[project]
name = "erpnext-ops"
version = "0"
description = "ERP domain knowledge and the build of its Claude plugin"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.5", "mypy==2.4.1", "PyGithub==2.8.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
