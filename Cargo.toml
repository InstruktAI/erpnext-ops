[package]
name = "erpnext"
version = "0.1.0"
edition = "2021"
description = "Agent-facing operating surface for per-tenant ERPNext sites"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"

[dev-dependencies]
httpmock = "0.7"

[profile.release]
strip = true
lto = true
